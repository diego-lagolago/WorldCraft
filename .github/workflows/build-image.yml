# Image-Build auf GitHub-hosted Runners (7 GB RAM). Coolify macht nur docker pull.
# next build auf dem VPS hat den Host bereits per OOM gekillt — nicht dorthin zurück.

name: Build image

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  verify:
    name: Test, typecheck, lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Unit tests
        run: npm test

      # PageProps/LayoutProps come from Next typed routes under .next/types (gitignored).
      - name: Typecheck
        run: |
          npx next typegen
          npx tsc --noEmit

      - name: Lint
        run: npm run lint

  docker:
    name: Build & Push Docker Image
    needs: verify
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # Coolify-VPS und GitHub-hosted ubuntu-latest sind amd64.
          platforms: linux/amd64
          tags: |
            ${{ steps.image.outputs.name }}:main
            ${{ steps.image.outputs.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Optional: Coolify nach dem Push zum Pull auffordern.
  # Ohne die Secrets bleibt das Image in GHCR; Deploy dann in Coolify manuell.
  notify-coolify:
    name: Notify Coolify to pull
    needs: docker
    runs-on: ubuntu-latest
    steps:
      - name: Webhook
        env:
          WEBHOOK_URL: ${{ secrets.COOLIFY_WEBHOOK_URL }}
          WEBHOOK_TOKEN: ${{ secrets.COOLIFY_WEBHOOK_TOKEN }}
        run: |
          if [ -z "$WEBHOOK_URL" ]; then
            echo "COOLIFY_WEBHOOK_URL ist nicht gesetzt."
            echo "Image liegt in GHCR (Tag :main). In Coolify manuell deployen oder die Secrets anlegen."
            exit 0
          fi
          # Coolify 4.2.0+: state-changing API verlangt POST.
          AUTH_HEADER=()
          if [ -n "$WEBHOOK_TOKEN" ]; then
            AUTH_HEADER=(-H "Authorization: Bearer ${WEBHOOK_TOKEN}")
          fi
          curl --fail --silent --show-error \
            -X POST "$WEBHOOK_URL" \
            "${AUTH_HEADER[@]}"
          echo "Coolify-Deploy ausgelöst."
