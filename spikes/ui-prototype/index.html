<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WorldCraft – UI-Prototyp (Plan 003)</title>
<style>
:root{
  --bg:#0b0b0f; --panel:#15151c; --panel2:#1c1c25; --line:#2a2a36; --text:#ece9e4; --muted:#9d9aa6;
  --accent:#f5b83d; --accent-ink:#1a1204; --blue:#6aa8ff; --red:#ff7a7a; --gm:#b69cff; --ok:#6ee7a8;
  --nav-h:64px; --rail-w:232px; --radius:14px;
  font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);height:100%}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select,textarea{font:inherit;color:var(--text);background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
textarea{min-height:90px;resize:vertical}
h1,h2,h3{margin:0}
.muted{color:var(--muted)}
.small{font-size:13px}
.row{display:flex;gap:10px;align-items:center}
.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.stack{display:flex;flex-direction:column;gap:12px}

/* ---------- Shell ---------- */
.shell{display:flex;min-height:100dvh}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.content{flex:1;padding:16px;max-width:980px;width:100%;margin:0 auto;padding-bottom:calc(var(--nav-h) + 28px + env(safe-area-inset-bottom))}
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:10px 16px;background:rgba(11,11,15,.9);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.topbar .world{font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.proto{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);margin-left:auto}
.proto select{width:auto;padding:6px 8px;font-size:12px}
.proto .tag{background:#2b2210;color:var(--accent);border:1px solid #4a3a14;border-radius:999px;padding:3px 8px;font-weight:600}

.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(4,1fr);height:calc(var(--nav-h) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:#111117;border-top:1px solid var(--line)}
.nav a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;color:var(--muted);min-height:48px}
.nav a .ic{font-size:22px;line-height:1}
.nav a.on{color:var(--accent)}
.nav .brand,.nav .rail-foot{display:none}
.shell.chat-focus .nav{display:none}
.shell.chat-focus .content{padding-bottom:0}

/* Desktop: gleiche vier Ziele als dauerhafte Seitenleiste */
@media (min-width:768px){
  .nav{position:sticky;top:0;align-self:flex-start;height:100dvh;width:var(--rail-w);display:flex;flex-direction:column;gap:4px;padding:16px 12px;border-top:0;border-right:1px solid var(--line)}
  .nav .brand{display:block;font-weight:700;letter-spacing:.04em;padding:6px 10px 14px;color:var(--accent)}
  .nav a{flex-direction:row;justify-content:flex-start;gap:12px;padding:10px 12px;border-radius:10px;font-size:15px;min-height:44px}
  .nav a:hover{background:var(--panel)}
  .nav a.on{background:var(--panel2)}
  .nav .rail-foot{display:block;margin-top:auto;font-size:12px;color:var(--muted);padding:10px}
  .shell.chat-focus .nav{display:flex}
  .content{padding:24px;padding-bottom:40px}
}

/* ---------- Bausteine ---------- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px}
.card h2{font-size:16px;margin-bottom:10px}
.section-h{display:flex;align-items:center;justify-content:space-between;margin:22px 0 10px}
.section-h h2{font-size:15px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.list{display:flex;flex-direction:column}
.item{display:flex;align-items:center;gap:12px;min-height:52px;padding:10px 12px;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item:active{background:var(--panel2)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:12px;background:var(--panel2);border:1px solid var(--line);font-weight:600}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{background:#2a1214;border-color:#5b1f24;color:#ffb3b3}
.btn.sm{min-height:36px;padding:0 12px;font-size:14px;border-radius:10px}
.btn.icon{width:44px;padding:0}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 12px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);font-size:14px;white-space:nowrap}
.chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.jpill{min-height:36px;font-size:13px}
.jpill.gm{color:var(--gm);border-color:#4b3c7a;background:#1d1830}
.badge.gm{color:var(--gm);border-color:#4b3c7a;background:#1d1830}
.badge.st-open{color:#cbd5e1}.badge.st-active{color:var(--accent);border-color:#5a4415}
.badge.st-completed{color:var(--ok);border-color:#1f5a3f}.badge.st-failed{color:var(--red);border-color:#5b1f24}
.av{flex:none;display:grid;place-items:center;width:40px;height:40px;border-radius:50%;font-weight:700;font-size:14px;color:#111}
.av.lg{width:84px;height:84px;font-size:28px}
.av.sm{width:30px;height:30px;font-size:12px}
.kind{font-size:12px;color:var(--muted)}
.hero{height:140px;border-radius:var(--radius);background:linear-gradient(135deg,#3b2a12,#1d3b4a 60%,#23183d);display:flex;align-items:flex-end;padding:14px;margin-bottom:14px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 80% 20%,rgba(245,184,61,.25),transparent 50%)}
.hero h1{position:relative;font-size:26px;text-shadow:0 2px 8px #000}
.prose{line-height:1.6}
.prose p{margin:0 0 10px}
.mention{color:var(--blue);font-weight:600;cursor:pointer}
.mention.stub{color:var(--red)}
.mention-plain{color:inherit}
.fields{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px}
.fields dt{color:var(--muted)}
.fields dd{margin:0}
.grid2{display:grid;grid-template-columns:1fr;gap:14px}
@media (min-width:768px){.grid2{grid-template-columns:1fr 1fr}}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--muted);min-height:40px;margin-bottom:6px}
.empty{padding:14px;color:var(--muted);font-size:14px}
.hint{font-size:12px;color:var(--muted);border-left:3px solid var(--accent);padding:6px 10px;background:#17140c;border-radius:0 8px 8px 0}

/* Verknüpft */
.linked h3{font-size:13px;color:var(--muted);margin:12px 0 4px;text-transform:uppercase;letter-spacing:.05em}
.linked .sub{font-size:12px;color:var(--muted);margin:6px 0 2px 2px}
.linked .item{min-height:46px;padding:8px 4px}
.rel-label{font-size:12px;color:var(--accent)}
.origin{font-size:11px;color:var(--muted)}

/* ---------- Sheet ---------- */
.sheet-bg{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-height:88dvh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:18px 18px 0 0;padding:14px 16px calc(18px + env(safe-area-inset-bottom))}
.sheet .grab{width:44px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 12px}
.sheet h2{font-size:18px}
@media (min-width:768px){
  .sheet-bg{align-items:center}
  .sheet{max-width:520px;border-radius:18px}
  .sheet .grab{display:none}
}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + 18px + env(safe-area-inset-bottom));z-index:80;background:#f3efe6;color:#141414;padding:10px 16px;border-radius:12px;font-size:14px;font-weight:600;box-shadow:0 8px 30px rgba(0,0,0,.4);max-width:92vw}
@media (min-width:768px){.toast{bottom:24px}}

/* ---------- Karte ---------- */
.map-page{position:relative;height:calc(100dvh - 53px - var(--nav-h) - env(safe-area-inset-bottom))}
@media (min-width:768px){.map-page{height:calc(100dvh - 53px)}}
.map-vp{position:absolute;inset:0;overflow:hidden;touch-action:none;background:#0f2436;cursor:grab}
.map-vp.placing{cursor:crosshair}
.map-cv{position:absolute;left:0;top:0;width:1600px;height:1200px;transform-origin:0 0;--inv:1}
.map-cv svg.bg{position:absolute;inset:0;width:100%;height:100%}
.pin{position:absolute;width:44px;height:54px;transform:translate(-50%,-100%) scale(var(--inv));transform-origin:50% 100%;touch-action:none;filter:drop-shadow(0 3px 4px rgba(0,0,0,.5))}
.pin img{width:44px;height:54px;display:block;pointer-events:none}
.pin.hidden-gm{opacity:.75}
.pin.hidden-gm::after{content:"SL";position:absolute;top:-6px;right:-8px;font-size:10px;font-weight:800;background:var(--gm);color:#140d2b;border-radius:6px;padding:1px 4px}
.pin.hl{animation:pulse 1.2s ease-out 3}
@keyframes pulse{0%{filter:drop-shadow(0 0 0 rgba(245,184,61,.9))}100%{filter:drop-shadow(0 0 22px rgba(245,184,61,0))}}
.pin.hl img{outline:3px solid var(--accent);outline-offset:3px;border-radius:50%}
.marker{position:absolute;transform:translate(-50%,-50%) scale(var(--inv));display:flex;flex-direction:column;align-items:center;gap:2px;touch-action:none}
.marker .av{width:42px;height:42px;border:3px solid var(--accent);box-shadow:0 3px 8px rgba(0,0,0,.6)}
.marker .nm{font-size:11px;font-weight:700;background:rgba(0,0,0,.7);padding:1px 6px;border-radius:6px;white-space:nowrap}
.map-top{position:absolute;left:12px;right:12px;top:12px;z-index:5;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.map-top .chip:not(.on){background:rgba(21,21,28,.92)}
@media (max-width:767px){
  .proto label{display:none}
  .map-hint{max-width:calc(100% - 90px);font-size:11px}
}
.map-ctrl{position:absolute;right:12px;bottom:14px;z-index:5;display:flex;flex-direction:column;gap:8px}
.fab{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;font-size:30px;background:var(--accent);color:var(--accent-ink);box-shadow:0 6px 18px rgba(0,0,0,.5)}
.zbtn{width:48px;height:48px;border-radius:14px;background:rgba(21,21,28,.94);border:1px solid var(--line);font-size:22px;display:grid;place-items:center}
.map-hint{position:absolute;left:12px;bottom:14px;z-index:5;max-width:60%;font-size:12px;background:rgba(21,21,28,.92);border:1px solid var(--line);border-radius:10px;padding:8px 10px;color:var(--muted)}
.type-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.type-grid button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border-radius:10px;border:1px solid var(--line);font-size:10px}
.type-grid button.on{border-color:var(--accent);background:#2b2210}
.type-grid img{width:30px;height:37px}

/* ---------- Chat ---------- */
.chat{display:flex;height:calc(100dvh - 53px - var(--nav-h) - env(safe-area-inset-bottom))}
.shell.chat-focus .chat{height:calc(100dvh - 53px)}
.chan-list{width:100%;overflow:auto;padding:8px 0}
.stream{display:none;flex:1;min-width:0;flex-direction:column}
.chat.open .chan-list{display:none}
.chat.open .stream{display:flex}
@media (min-width:768px){
  .chat,.shell.chat-focus .chat{height:calc(100dvh - 53px)}
  .chan-list,.chat.open .chan-list{display:block;width:290px;flex:none;border-right:1px solid var(--line)}
  .stream,.chat.open .stream{display:flex}
  .stream-back{display:none!important}
}
.chan{display:flex;align-items:center;min-height:48px;padding:0 8px 0 4px}
.chan.on,.thr.on{background:var(--panel2)}
.chev{width:40px;height:44px;display:grid;place-items:center;color:var(--muted);font-size:14px;transition:transform .15s}
.chev.open{transform:rotate(90deg)}
.chev-sp{width:40px;flex:none}
.chan a{flex:1;display:flex;align-items:center;gap:8px;min-height:44px;font-weight:600}
.chan .hash{color:var(--muted);font-weight:500}
.thr{display:flex;align-items:center;min-height:42px;padding:0 10px 0 44px;position:relative}
.thr::before{content:"";position:absolute;left:24px;top:0;bottom:50%;width:12px;border-left:2px solid var(--line);border-bottom:2px solid var(--line);border-bottom-left-radius:8px}
.thr a{flex:1;display:flex;align-items:center;gap:6px;min-height:40px;font-size:14px;color:#d6d2cb}
.more{width:40px;height:40px;display:grid;place-items:center;color:var(--muted);font-size:18px;border-radius:10px}
.stream-h{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line);min-height:54px}
.msgs{flex:1;overflow:auto;padding:12px 14px;display:flex;flex-direction:column;gap:14px}
.msg{display:flex;gap:10px}
.msg .body{min-width:0;flex:1}
.msg .who{font-weight:700;font-size:14px}
.msg .when{font-size:11px;color:var(--muted);margin-left:6px;font-weight:400}
.msg .txt{font-size:15px;line-height:1.45;word-wrap:break-word}
.dice{display:inline-flex;align-items:center;gap:8px;margin-top:2px;padding:6px 10px;border-radius:10px;background:#1f1a0e;border:1px solid #4a3a14;font-family:ui-monospace,Menlo,monospace;font-size:14px}
.dice b{color:var(--accent);font-size:16px}
.thread-card{margin-top:4px;display:inline-flex;align-items:center;gap:8px;padding:8px 12px;border-radius:10px;background:var(--panel2);border:1px solid var(--line);font-size:14px}
.del{margin-left:auto;color:var(--muted);width:32px;height:32px;border-radius:8px;flex:none}
.composer{display:flex;align-items:flex-end;gap:6px;padding:8px 8px calc(8px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:#111117}
.composer .cb{width:44px;height:44px;flex:none;border-radius:12px;display:grid;place-items:center;font-size:20px;background:var(--panel2);border:1px solid var(--line)}
.composer .cb.send{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.composer .in{flex:1;min-height:44px;max-height:120px;border-radius:12px;padding:11px 12px}
.pop{position:absolute;bottom:62px;left:8px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:6px;z-index:10;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.pop button{display:flex;gap:10px;align-items:center;min-height:44px;padding:0 14px;border-radius:8px;width:100%}
.dice-dies{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.dice-dies button{min-height:48px;border-radius:10px;border:1px solid var(--line);font-weight:700}
.dice-dies button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.stepper{display:flex;align-items:center;gap:8px}
.stepper button{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);font-size:20px}
.stepper span{min-width:44px;text-align:center;font-size:20px;font-weight:700}
.toggle{display:flex;align-items:center;justify-content:space-between;min-height:48px}
.sw{width:50px;height:30px;border-radius:99px;background:var(--line);position:relative;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .15s}
.sw.on{background:var(--accent)}
.sw.on::after{left:23px}

/* ---------- Editor ---------- */
.toolbar{display:flex;gap:4px;overflow-x:auto;padding:6px;border:1px solid var(--line);border-bottom:0;border-radius:12px 12px 0 0;background:var(--panel2);scrollbar-width:none}
.toolbar button{min-width:40px;height:40px;border-radius:8px;font-weight:700;flex:none}
.toolbar button:active{background:var(--line)}
.toolbar .sep{width:1px;background:var(--line);margin:6px 2px;flex:none}
.editor{min-height:220px;padding:14px;border:1px solid var(--line);border-radius:0 0 12px 12px;background:var(--panel);line-height:1.6;outline:none}
.editor h2{font-size:20px;margin:8px 0}.editor h3{font-size:17px;margin:6px 0}
.editor blockquote,.prose blockquote{border-left:3px solid var(--line);margin:8px 0;padding-left:12px;color:#cfcac2}
.suggest{border:1px solid var(--line);border-radius:12px;background:var(--panel);margin-top:6px;overflow:hidden}
.suggest button{display:flex;align-items:center;justify-content:space-between;width:100%;min-height:46px;padding:0 14px;border-bottom:1px solid var(--line);text-align:left}
.suggest button:last-child{border-bottom:0}
.suggest .new{color:var(--accent);font-weight:600}

/* Charakterbogen */
.attrs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media (min-width:768px){.attrs{grid-template-columns:repeat(6,1fr)}}
.attr{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.attr .k{font-size:11px;color:var(--muted);font-weight:700;letter-spacing:.06em}
.attr .v{font-size:22px;font-weight:800}
.attr .m{font-size:13px;color:var(--accent)}
.skill{display:flex;align-items:center;justify-content:space-between;min-height:38px;border-bottom:1px solid var(--line);font-size:14px}
.skill-edit{display:flex;flex-direction:column;gap:6px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.skill-edit:last-child{border-bottom:0;padding-bottom:0}
.sk-row{display:flex;gap:6px}
.sk-row select{flex:1;min-width:0;padding:8px}.lvl{font-size:12px;color:var(--muted)}
.sk-total{font-size:16px;min-width:36px;text-align:right}
.lvl.untalented{color:var(--red)}
.lvl.trained{color:var(--blue)}.lvl.expertise{color:var(--accent);font-weight:700}
.thumbs{display:flex;gap:8px;overflow-x:auto}
.thumb{width:96px;height:72px;border-radius:10px;flex:none;background:linear-gradient(135deg,#2b3a4a,#3b2a3a)}

/* Login */
.center{min-height:100dvh;display:grid;place-items:center;padding:24px}
.login{max-width:380px;width:100%;text-align:center}
.logo{font-size:44px;margin-bottom:6px}
.discord{background:#5865f2;border-color:#5865f2;color:#fff;width:100%}
</style>
</head>
<body>
<div id="app"></div>
<div id="overlay"></div>
<script>
/* =====================================================================
   WorldCraft UI-Prototyp zu Plan 003. Reine Attrappe: keine Server,
   keine Persistenz. Die Rolle oben rechts simuliert die Rechtematrix.
   ===================================================================== */

const PIN_META = {
  danger:["Gefahr","#b91c1c"], boss:["Boss","#6b21a8"], house:["Haus","#92400e"], city:["Stadt","#334155"],
  treasure:["Schatz","#ca8a04"], landmark:["Stern","#d97706"], fishing:["Angeln","#0891b2"], plants:["Pflanzen","#15803d"],
  dungeon:["Dungeon","#44403c"], quest:["Quest","#1d4ed8"], teleporter:["Teleporter","#c026d3"], shop:["Shop","#c2410c"]
};
const PICTO = {
  danger:`<path fill="currentColor" fill-rule="evenodd" d="M12 2.2 22.6 21.4H1.4L12 2.2Zm0 6.4c.6 0 1.1.5 1.1 1.1v4.6c0 .6-.5 1.1-1.1 1.1s-1.1-.5-1.1-1.1V9.7c0-.6.5-1.1 1.1-1.1Zm0 8.6a1.3 1.3 0 1 1 0 2.6 1.3 1.3 0 0 1 0-2.6Z"/>`,

function get(k,id){ return ({article:D.articles,quest:D.quests,universe:D.universes,character:D.characters,pin:D.pins})[k]?.[id]; }
function visible(k,id){
  const o = get(k,id); if(!o) return false;

  if(k==="pin"){ const m=D.maps[o.m]; return o.vis==="published" && m.vis==="published" && D.universes[m.u].vis==="published"; }

}

}

/* ---------------- Relationen (automatisch + manuell) ---------------- */
function allRelations(){
  const out = [];
  const scan = (k,id,html)=>{ (html||"").replace(/\[\[(\w+):(\w+)\]\]/g,(_,tk,tid)=>{ out.push({from:[k,id],to:[tk,tid],origin:"mention"}); }); };
  for(const [id,a] of Object.entries(D.articles)){
    scan("article",id,a.body);
    for(const f of TEMPLATES[a.tpl].fields){ const v=a.f[f.k]; if(f.t==="ref" && v) out.push({from:["article",id],to:v,origin:"template_field",field:f.l}); }
  }
  for(const [id,q] of Object.entries(D.quests)){ scan("quest",id,q.desc); q.parts.forEach(c=>out.push({from:["quest",id],to:["character",c],origin:"participation"})); }
  for(const [id,p] of Object.entries(D.pins)) scan("pin",id,p.desc);
  for(const [id,u] of Object.entries(D.universes)) scan("universe",id,u.desc);
  for(const [id,c] of Object.entries(D.characters)) scan("character",id,c.bio);
  D.manual.forEach(r=>out.push({...r,origin:"manual"}));
  return out;
}
const ORIGIN = {mention:"Erwähnung",template_field:"Vorlagenfeld",participation:"Beteiligung",manual:"manuell"};
function linkedHtml(k,id){
  const rels = allRelations().filter(r=>(r.from[0]===k&&r.from[1]===id)||(r.to[0]===k&&r.to[1]===id))
    .filter(r=>visible(...r.from)&&visible(...r.to));
  const groups = {pin:[],article:[],quest:[],character:[],universe:[]}; const seen=new Map();
  for(const r of rels){
    const outgoing = r.from[0]===k && r.from[1]===id;
    const [ok,oid] = outgoing ? r.to : r.from;
    const label = r.origin==="manual" ? (outgoing ? r.label : (r.counter||r.label)) : "";
    const why = ORIGIN[r.origin]+(r.field?" · "+r.field:"");
    const key = ok+oid+label;
    if(seen.has(key)){ const it=seen.get(key); if(!it.why.includes(why)) it.why.push(why); continue; }
    const it = {ok,oid,label,why:[why]}; seen.set(key,it); groups[ok]?.push(it);
  }
  const names = {pin:"Pins",article:"Artikel",quest:"Quests",character:"Charaktere",universe:"Universen"};
  let html = "";
  for(const g of ["pin","article","quest","character","universe"]){
    const items = groups[g]; if(!items.length) continue;
    html += `<h3>${names[g]}</h3>`;
    const render = it => {
      const extra = it.label ? `<div class="rel-label">${esc(it.label)}</div>` : `<div class="origin">${esc(it.why.join(" · "))}</div>`;
      let lead = "";
      if(g==="pin"){ const p=D.pins[it.oid]; lead=`<img src="${pinIcon(p.t)}" width="26" height="31" alt="">`; }
      if(g==="character"){ lead=avatar(D.characters[it.oid].name,"sm"); }
      let meta = "";
      if(g==="pin") meta = `<span class="kind">${esc(D.maps[D.pins[it.oid].m].name)}</span>`;
      if(g==="quest") meta = statusBadge(D.quests[it.oid].status);
      return `<a class="item" href="${href(g,it.oid)}">${lead}<div class="grow"><div>${esc(title(g,it.oid))}</div>${extra}</div>${meta}</a>`;
    };
    if(g==="article"){
      const byTpl = {}; items.forEach(it=>{ const t=D.articles[it.oid].tpl; (byTpl[t]=byTpl[t]||[]).push(it); });
      for(const [t,its] of Object.entries(byTpl)) html += `<div class="sub">${TEMPLATES[t].plural}</div><div class="list">${its.map(render).join("")}</div>`;
    } else html += `<div class="list">${items.map(render).join("")}</div>`;
  }
  const add = isStaff() ? `<button class="btn sm" data-act="manual-rel" data-k="${k}" data-id="${id}">+ Relation</button>` : "";
  return `<div class="card linked"><div class="row" style="justify-content:space-between"><h2 style="margin:0">Verknüpft</h2>${add}</div>${html||'<div class="empty">Noch keine Verknüpfungen.</div>'}</div>`;
}

/* ---------------- Rendering-Helfer ---------------- */
function esc(s){ return String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function hue(s){ let h=0; for(const c of s) h=(h*31+c.charCodeAt(0))%360; return h; }
function initials(n){ return n.split(/\s+/).map(w=>w[0]).slice(0,2).join("").toUpperCase(); }
function avatar(name,cls=""){ return `<span class="av ${cls}" style="background:hsl(${hue(name)} 60% 68%)">${initials(name)}</span>`; }
function gmBadge(vis){ return vis==="gm_only" && isStaff() ? `<span class="badge gm">nur Spielleitung</span>` : ""; }
const STATUS = {open:"offen",active:"aktiv",completed:"abgeschlossen",failed:"gescheitert"};
function statusBadge(s){ return `<span class="badge st-${s}">${STATUS[s]}</span>`; }
function rich(html){
  return (html||"").replace(/\[\[(\w+):(\w+)\]\]/g,(_,k,id)=>{
    const o=get(k,id); if(!o) return "?";
    const t = esc(title(k,id));
    if(!visible(k,id)) return `<span class="mention-plain">${t}</span>`;
    const stub = k==="article" && !o.edited;
    return `<a class="mention ${stub?"stub":""}" href="${href(k,id)}">${t}</a>`;
  });
}
function chatText(s){ return esc(s).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/\*(.+?)\*/g,"<i>$1</i>"); }
function toast(msg){
  const el=document.createElement("div"); el.className="toast"; el.textContent=msg; document.body.appendChild(el);
  setTimeout(()=>el.remove(),2600);
}
function sheet(html){
  document.getElementById("overlay").innerHTML = `<div class="sheet-bg" data-act="close-sheet"><div class="sheet" role="dialog"><div class="grab"></div>${html}</div></div>`;
}
function closeSheet(){ document.getElementById("overlay").innerHTML=""; }

function searchResults(){
  const q = S.search.trim().toLowerCase();
  if(q.length<2) return "";
  const hits = [];
  const strip = h => (h||"").replace(/\[\[(\w+):(\w+)\]\]/g,(_,k,id)=>title(k,id)).replace(/<[^>]+>/g," ");
  const push = (k,id,t,body)=>{ if(!visible(k,id)) return; const b=strip(body); if((t+" "+b).toLowerCase().includes(q)){
      const i=b.toLowerCase().indexOf(q); const snip = i<0 ? b.slice(0,120) : "…"+b.slice(Math.max(0,i-40),i+120)+"…";
      hits.push({k,id,t,snip}); } };
  for(const [id,a] of Object.entries(D.articles)) push("article",id,a.title,a.body);
  for(const [id,x] of Object.entries(D.quests)) push("quest",id,x.title,x.desc);
  for(const [id,x] of Object.entries(D.universes)) push("universe",id,x.name,x.desc);
  for(const [id,x] of Object.entries(D.pins)) push("pin",id,x.title,x.desc);
  for(const [id,x] of Object.entries(D.characters)) push("character",id,x.name,x.bio);
  if(!hits.length) return `<div class="card empty">Keine Treffer für „${esc(S.search)}“.</div>`;
  return `<div class="card list" style="padding:0 4px">${hits.slice(0,20).map(h=>`<a class="item" href="${href(h.k,h.id)}"><div class="grow"><div>${esc(h.t)} <span class="kind">· ${kindLabel(h.k,h.id)}</span></div><div class="small muted">${esc(h.snip.slice(0,300))}</div></div></a>`).join("")}
    <div class="small muted" style="padding:8px 12px">Tagebücher werden nicht durchsucht.</div></div>`;
}

function viewMap(q){

  if(!visible("universe",S.universe)) S.universe = unis[0][0];
  const u = D.universes[S.universe]; const mId = u.map; const m = D.maps[mId];
  const mapVisible = isStaff() || (m.vis==="published" && u.vis==="published");
  const pins = Object.entries(D.pins).filter(([id,p])=>p.m===mId && visible("pin",id));
  const markers = Object.entries(D.markers[mId]||{}).filter(([c])=>D.brought.includes(c));
  const inner = `<div class="map-page">
    <div class="map-top">${unis.map(([id,x])=>`<a class="chip ${id===S.universe?"on":""}" href="#/w/w1/map?universe=${id}">🪐 ${esc(x.name)}${x.vis==="gm_only"?" · SL":""}</a>`).join("")}</div>

    </div></div>
    <div class="map-hint">${S.placing ? "Tippe auf die Karte, um den Pin zu setzen." : "Ziehen = verschieben · Pinch/Scroll = zoomen · Pin antippen = Details. Nach dem Ablegen sehen alle die neue Position."}</div>

  S.mapCtx = {mId, pinId};
  return shell("map", inner, {full:true});
}
function mountMap(){
  const vp = document.getElementById("vp"), cv = document.getElementById("cv");
  if(!vp) return;
  const W=1600,H=1200; const r = vp.getBoundingClientRect();
  const fit = Math.min(r.width/W, r.height/H);
  const key = S.mapCtx.mId;
  if(!S.map || S.lastMap!==key){ S.map={s:fit,x:(r.width-W*fit)/2,y:(r.height-H*fit)/2}; S.lastMap=key; }
  if(S.mapCtx.pinId){ const p=D.pins[S.mapCtx.pinId]; const s=Math.max(fit*3,0.9); S.map={s,x:r.width/2-p.x*W*s,y:r.height/2-p.y*H*s}; S.mapCtx.pinId=null; }
  const M = S.map; const minS = fit*0.8, maxS = 4;
  const apply = ()=>{ cv.style.transform=`translate(${M.x}px,${M.y}px) scale(${M.s})`; cv.style.setProperty("--inv",1/M.s); };
  const zoomAt = (f,cx,cy)=>{ const ns=Math.min(maxS,Math.max(minS,M.s*f)); const k=ns/M.s; M.x=cx-(cx-M.x)*k; M.y=cy-(cy-M.y)*k; M.s=ns; apply(); };
  S.mapZoom = f=>zoomAt(f,r.width/2,r.height/2);
  S.mapFit = ()=>{ Object.assign(M,{s:fit,x:(r.width-W*fit)/2,y:(r.height-H*fit)/2}); apply(); };
  apply();
  vp.addEventListener("wheel",e=>{ e.preventDefault(); const b=vp.getBoundingClientRect(); zoomAt(Math.exp(-e.deltaY*0.0022),e.clientX-b.left,e.clientY-b.top); },{passive:false});
  const pts = new Map(); let pan=null, pinch=null, drag=null;
  const toMap = (cx,cy)=>{ const b=vp.getBoundingClientRect(); return [ (cx-b.left-M.x)/M.s/W, (cy-b.top-M.y)/M.s/H ]; };
  vp.addEventListener("pointerdown",e=>{
    const el = e.target.closest("[data-drag]");
    vp.setPointerCapture(e.pointerId);
    pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(el && pts.size===1){ drag={el,kind:el.dataset.drag,id:el.dataset.id,sx:e.clientX,sy:e.clientY,moved:false}; return; }
    drag=null;
    if(pts.size===1) pan={sx:e.clientX,sy:e.clientY,ox:M.x,oy:M.y,moved:false};
    if(pts.size===2){ const [a,b]=[...pts.values()]; pinch={d:Math.hypot(a.x-b.x,a.y-b.y)}; pan=null; }
  });
  vp.addEventListener("pointermove",e=>{
    if(!pts.has(e.pointerId)) return; pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(drag){
      const dist=Math.hypot(e.clientX-drag.sx,e.clientY-drag.sy);
      if(dist>6){
        const allowed = drag.kind==="pin" ? isStaff() : canEditMarker(drag.id);
        if(!allowed){ if(!drag.warned){ toast(drag.kind==="pin"?"Nur die Spielleitung verschiebt Pins.":"Du darfst nur eigene Charakter-Marker verschieben."); drag.warned=true; } return; }
        drag.moved=true; const [x,y]=toMap(e.clientX,e.clientY);
        drag.el.style.left=Math.min(100,Math.max(0,x*100))+"%"; drag.el.style.top=Math.min(100,Math.max(0,y*100))+"%";
      }
      return;
    }
    if(pinch && pts.size===2){ const [a,b]=[...pts.values()]; const d=Math.hypot(a.x-b.x,a.y-b.y); const bb=vp.getBoundingClientRect(); zoomAt(d/pinch.d,(a.x+b.x)/2-bb.left,(a.y+b.y)/2-bb.top); pinch.d=d; return; }
    if(pan){ const dx=e.clientX-pan.sx, dy=e.clientY-pan.sy; if(Math.hypot(dx,dy)>4) pan.moved=true; M.x=pan.ox+dx; M.y=pan.oy+dy; apply(); }
  });
  const end = e=>{
    pts.delete(e.pointerId);
    if(drag){
      const d=drag; drag=null;
      if(d.moved){
        const x=parseFloat(d.el.style.left)/100, y=parseFloat(d.el.style.top)/100;
        if(d.kind==="pin"){ D.pins[d.id].x=x; D.pins[d.id].y=y; } else { D.markers[key][d.id]=[x,y]; }
        toast("Position gespeichert – an alle Anwesenden gesendet");
      } else if(!d.warned){ if(d.kind==="pin") openPin(d.id); else openMarker(d.id); }
      return;
    }
    if(pan && !pan.moved && S.placing){ const [x,y]=toMap(e.clientX,e.clientY); S.placing=false; vp.classList.remove("placing"); openNewPin(x,y,key); }
    if(pts.size<2) pinch=null; if(!pts.size) pan=null;
  };
  vp.addEventListener("pointerup",end); vp.addEventListener("pointercancel",end);
}

/* ---------------- Router ---------------- */
function route(){
  const raw = location.hash.slice(1) || "/";
  const [path, query] = raw.split("?");
  const p = path.split("/").filter(Boolean);
  closeSheet();
  let html;
  if(p.length===0) html = viewLogin();
  else if(p[0]==="onboarding") html = viewOnboarding();
  else if(p[0]==="invite") html = viewInvite();
  else if(p[0]==="characters") html = viewCharEdit(p[1]);
  else if(p[0]==="w"){
    const sec = p[2];
    if(!sec) html = viewHub();
    else if(sec==="articles") html = p[4]==="edit" ? viewArticleEdit(p[3]) : viewArticle(p[3]);
    else if(sec==="quests") html = viewQuest(p[3]);
    else if(sec==="universes") html = viewUniverse(p[3]);
    else if(sec==="map") html = viewMap(query);
    else if(sec==="chat") html = viewChat(p[3],p[4]);
    else if(sec==="menu") html = viewMenu();
    else if(sec==="characters") html = p[3] ? viewWorldChar(p[3]) : viewMenu();
    else if(sec==="journal") html = viewJournal(p[3]);
  }
  document.getElementById("app").innerHTML = html || viewLogin();
  if(p[2]==="map") mountMap();
  if(p[2]==="chat"){ const m=document.getElementById("msgs"); if(m) m.scrollTop=m.scrollHeight; }
  if(p[2]==="articles" && p[4]==="edit") mountEditor();
  window.scrollTo(0,0);
}
window.addEventListener("hashchange", route);
let lastMobile = matchMedia("(max-width:767px)").matches;
window.addEventListener("resize", ()=>{
  const mob = matchMedia("(max-width:767px)").matches;
  if(mob!==lastMobile){ lastMobile=mob; S.map=null; route(); }
});

/* ---------------- Editor: @-Erwähnungen ---------------- */
function mentionables(){
  const out=[];
  for(const [id,a] of Object.entries(D.articles)) if(visible("article",id)) out.push(["article",id,a.title]);
  for(const [id,q] of Object.entries(D.quests)) if(visible("quest",id)) out.push(["quest",id,q.title]);
  D.brought.forEach(c=>out.push(["character",c,D.characters[c].name]));
  for(const [id,u] of Object.entries(D.universes)) if(visible("universe",id)) out.push(["universe",id,u.name]);
  return out;
}
function mountEditor(){
  const ed = document.getElementById("editor"), box = document.getElementById("suggest");
  if(!ed) return;
  let ctx = null;
  const update = ()=>{
    const sel = getSelection(); if(!sel.rangeCount || !ed.contains(sel.anchorNode) || sel.anchorNode.nodeType!==3){ box.innerHTML=""; ctx=null; return; }
    const txt = sel.anchorNode.textContent.slice(0, sel.anchorOffset);
    const m = txt.match(/@([^@\n]{0,40})$/);
    if(!m){ box.innerHTML=""; ctx=null; return; }
    const q = m[1]; ctx = {node:sel.anchorNode, end:sel.anchorOffset, start:sel.anchorOffset-m[0].length, q};
    const ql = q.toLowerCase();
    const hits = mentionables().filter(([,,t])=>t.toLowerCase().includes(ql))
      .sort((a,b)=>{ const wa=a[2].toLowerCase().split(/\s+/).some(w=>w.startsWith(ql))?0:1, wb=b[2].toLowerCase().split(/\s+/).some(w=>w.startsWith(ql))?0:1; return wa-wb || a[2].localeCompare(b[2]); })
      .slice(0,10);
    box.innerHTML = `<div class="suggest">${hits.map(([k,id,t])=>`<button data-act="pick" data-k="${k}" data-id="${id}"><span>${esc(t)}</span><span class="kind">${kindLabel(k,id)}</span></button>`).join("")}
      ${!hits.length && q.trim().length>=2 ? `<button data-act="pick-new" class="new">＋ Neuen Artikel „${esc(q.trim())}“ anlegen</button>` : ""}
      ${!hits.length && q.trim().length<2 ? `<div class="empty">Tippe weiter …</div>`:""}</div>`;
  };
  ed.addEventListener("keyup", update); ed.addEventListener("click", update);
  ed.addEventListener("paste", e=>{ e.preventDefault(); const t=e.clipboardData.getData("text/plain"); document.execCommand("insertText",false,t); toast("Eingefügt als Text – Bilder und Tabellen verworfen"); });
  S.insertMention = (k,id)=>{
    if(!ctx) return;
    const r = document.createRange(); r.setStart(ctx.node,ctx.start); r.setEnd(ctx.node,ctx.end); r.deleteContents();
    const span = document.createElement("span"); span.className="mention"+(k==="article"&&!D.articles[id].edited?" stub":""); span.contentEditable="false"; span.dataset.k=k; span.dataset.id=id; span.textContent=title(k,id);
    r.insertNode(span); const sp=document.createTextNode("\u00a0"); span.after(sp);
    const s=getSelection(); s.removeAllRanges(); const r2=document.createRange(); r2.setStartAfter(sp); s.addRange(r2);
    box.innerHTML=""; ctx=null; ed.focus();
  };
  S.newStub = ()=>{ const t=ctx.q.trim(); const id="a"+(nextId++); D.articles[id]={title:t,tpl:"none",vis:"gm_only",edited:false,body:"",f:{}}; S.insertMention("article",id); toast(`Artikel „${t}“ angelegt – rot, bis er Inhalt hat`); };
  document.querySelectorAll("[data-cmd]").forEach(b=>b.addEventListener("mousedown",e=>{
    e.preventDefault(); const c=b.dataset.cmd;
    if(c==="createLink"){ const u=prompt("Externer Link (https://…)"); if(u) document.execCommand("createLink",false,u); }
    else document.execCommand(c,false,b.dataset.v||null);
  }));
}

      break; }

    case "ab-del": readAbilityDraft(); S.abilityDraft.splice(parseInt(a.dataset.i),1); renderAbilityDraft(false); break;
    case "save-char": {
      readSkillDraft(); readAbilityDraft();
      const names = S.skillDraft.map(s=>s.name.trim());
      if(names.some(n=>!n)){ toast("Jede Fertigkeit braucht einen Namen"); break; }
      const dup = duplicateText(names);
      if(dup){ toast(`Fertigkeit „${dup}“ gibt es schon`); break; }
      const texts = S.abilityDraft.map(f=>f.text.trim());
      if(texts.some(t=>!t)){ toast("Jede Fähigkeit braucht einen Text"); break; }
      const dupAb = duplicateText(texts);
      if(dupAb){ toast(`Fähigkeit „${dupAb}“ gibt es schon`); break; }
      const c = D.characters[a.dataset.id];
      c.sk = S.skillDraft.map(s=>({...s,name:s.name.trim()}));
      c.ab = S.abilityDraft.map(f=>({...f,text:f.text.trim()}));
      const attrs = [...document.querySelectorAll("[data-attr]")].map(el=>Math.min(30,Math.max(1,parseInt(el.value)||10)));
      if(attrs.length===6) c.attrs = attrs;
      const prof = parseInt(document.getElementById("prof").value);
      if(isNaN(prof) || prof<PROF_MIN || prof>PROF_MAX){ toast(`Übungsbonus muss zwischen ${PROF_MIN} und ${PROF_MAX} liegen`); break; }
      c.prof = prof;
      S.skillDraftFor = null; location.hash = `#/w/w1/characters/${a.dataset.id}`; toast("Charakter gespeichert"); break; }
    case "jvis-toggle": {
      const j = D.journal.find(x=>x.id===a.dataset.id);
      const toShared = j.vis==="private";
      sheet(`<h2>${toShared?"Mit Spielleitung teilen?":"Wieder privat machen?"}</h2>
        <p class="muted">${toShared
          ? "Game Master und Master können diesen Eintrag danach lesen. Auch wenn du ihn später wieder auf privat stellst, kann die Spielleitung ihn bis dahin gesehen haben."
          : "Nur du siehst den Eintrag danach. Was die Spielleitung bereits gelesen hat, lässt sich nicht zurücknehmen."}</p>
        <div class="row" style="margin-top:14px"><button class="btn grow" data-act="close-sheet">Abbrechen</button>
        <button class="btn primary grow" data-act="jvis-confirm" data-id="${j.id}">${toShared?"Teilen":"Privat machen"}</button></div>`);
      break; }
    case "jvis-confirm": {
      const j = D.journal.find(x=>x.id===a.dataset.id);
      j.vis = j.vis==="private" ? "shared_with_gm" : "private";
      route(); toast(j.vis==="private" ? "Jetzt privat" : "Jetzt mit Spielleitung geteilt"); break; }
    case "jvis": document.querySelectorAll("[data-act=jvis]").forEach(b=>b.classList.toggle("on",b===a)); break;
    case "save-journal": { const body=document.getElementById("j-body").value.trim(); if(!body){ toast("Inhalt ist Pflicht"); break; }
      const vis=document.querySelector("[data-act=jvis].on").dataset.v; D.journal.push({id:"j"+(nextId++),c:a.dataset.c,title:document.getElementById("j-title").value.trim(),vis,body:`<p>${esc(body)}</p>`}); route(); toast("Eintrag gespeichert"); break; }
  }
});
document.addEventListener("change", e=>{
  const a = e.target.closest("[data-act]"); if(a?.dataset.act==="role"){ S.role=a.value; S.map=null; route(); toast("Ansicht als "+ROLE_LABEL[S.role]); }
  if(a?.dataset.act==="tpl"){ if(confirm("Vorlage wechseln? Nicht passende Vorlagenfelder werden verworfen.")){ S.editTpl=a.value; route(); } else a.value=S.editTpl; }
  if(a?.dataset.act==="toast-change") toast(a.dataset.msg);
  if(e.target.dataset.attr!=null){ const v=parseInt(e.target.value)||1; document.getElementById("mod"+e.target.dataset.attr).textContent = v<1||v>30 ? "1–30!" : mod(v); }
});
document.addEventListener("input", e=>{
  if(e.target.id==="search"){ S.search=e.target.value; clearTimeout(S.st); S.st=setTimeout(()=>{ document.getElementById("search-results").innerHTML=searchResults(); },300); }
});
document.addEventListener("keydown", e=>{
  if(e.target.id==="chat-in" && e.key==="Enter" && !e.shiftKey){ e.preventDefault(); document.querySelector("[data-act=send]").click(); }
});
route();
</script>
</body>
</html>
